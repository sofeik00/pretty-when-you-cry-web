<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Мой фотоальбом</title>
  <style>
    @font-face { font-family: 'MyHandFont'; src: url('myfont.ttf') format('truetype'); }
    body { background-color: #1a1a2e; background-image: url('fon.jpg'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; color: #ffd1dc; font-family: 'MyHandFont', 'Comic Sans MS', cursive; text-align: left; padding: 20px; min-height: 100vh; box-sizing: border-box; cursor: none !important; }
    *, *::before, *::after { cursor: none !important; }
    audio, audio::-webkit-media-controls { cursor: none !important; }
    .flying-paw { position: fixed; width: 40px; height: 40px; pointer-events: none; z-index: 2147483647; transform: translate(-50%, -50%); background-size: contain; background-repeat: no-repeat; background-position: center; transition: transform 0.05s ease-out; background-image: url('paw1.png'); filter: saturate(1.6) contrast(1.1) drop-shadow(0 0 4px #ffb6c1); }
    h1 { color: #ffb6c1; text-shadow: 2px 2px 0px #000; border-bottom: 3px dashed #ffb6c1; padding-bottom: 10px; margin-top: 0; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #ffc0cb; text-decoration: none; background-color: rgba(255, 182, 193, 0.15); border: 2px outset #ffb6c1; padding: 8px 16px; border-radius: 6px; font-size: 0.95em; }
    .back-btn:hover { background-color: rgba(255, 182, 193, 0.35); color: #fff; }
    .gallery { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .gallery-item { position: relative; background-color: rgba(0, 0, 0, 0.7); border: 3px outset #ffb6c1; padding: 8px; border-radius: 8px; width: 200px; }
    .gallery-item img { width: 100%; height: 150px; object-fit: cover; border: 2px solid #ffb6c1; border-radius: 4px; display: block; }
    .gallery-item .caption { margin-top: 6px; font-size: 0.85em; color: #ffd1dc; text-align: center; word-wrap: break-word; }
    .player { position: fixed; bottom: 15px; right: 15px; z-index: 1000; background-color: rgba(0, 0, 0, 0.7); border: 3px outset #ffb6c1; padding: 6px; border-radius: 8px; display: flex; align-items: center; gap: 6px; width: 260px; height: 90px; }
    .player audio { width: 190px; height: 40px; }
    .player audio::-webkit-media-controls-time-remaining-display, .player audio::-webkit-media-controls-current-time-display { display: none; }
    .player img { width: 55px; height: 55px; object-fit: cover; border: 2px solid #ffb6c1; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="flying-paw"></div>

  <!-- ИСПРАВЛЕНА ССЫЛКА НА ГЛАВНУЮ! -->
  <a href="index.html" class="back-btn">← На главную</a>

  <h1>📷 Мой фотоальбом</h1>
  <p>Тут я собираю свои любимые картинки и фотографии.</p>

  <div class="gallery">
    <div class="gallery-item">
      <img src="photo1.jpg" alt="Фото 1">
      <div class="caption">Моё первое фото</div>
    </div>
    <div class="gallery-item">
      <img src="photo2.jpg" alt="Фото 2">
      <div class="caption">Любимый кот</div>
    </div>
  </div>

  <div class="player">
    <img src="cover.jpg" alt="Обложка">
    <audio controls loop id="myMusic">
      <source src="music.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const paw = document.querySelector('.flying-paw');
    const totalFrames = 10; const speed = 100; let currentFrame = 1;
    for (let i = 1; i <= totalFrames; i++) { const img = new Image(); img.src = 'paw' + i + '.png'; }
    document.addEventListener('mousemove', (e) => { paw.style.left = e.clientX + 'px'; paw.style.top = e.clientY + 'px'; });
    setInterval(() => { paw.style.backgroundImage = `url('paw${currentFrame}.png')`; currentFrame++; if (currentFrame > totalFrames) currentFrame = 1; }, speed);
    function hideCursorEverywhere() { document.querySelectorAll('*').forEach(el => el.style.cursor = 'none'); }
    hideCursorEverywhere(); const observer = new MutationObserver(() => hideCursorEverywhere()); observer.observe(document.body, { childList: true, subtree: true });

    const audio = document.getElementById('myMusic');
    const savedTime = localStorage.getItem('musicTime');
    const wasPlaying = localStorage.getItem('musicPlaying') === 'true';
    if (savedTime) audio.currentTime = parseFloat(savedTime);
    if (wasPlaying) { audio.play().catch(() => { document.body.addEventListener('click', () => audio.play(), { once: true }); }); }
    audio.addEventListener('timeupdate', () => { localStorage.setItem('musicTime', audio.currentTime); });
    audio.addEventListener('play', () => { localStorage.setItem('musicPlaying', 'true'); });
    audio.addEventListener('pause', () => { localStorage.setItem('musicPlaying', 'false'); });
  </script>
</body>
</html>
